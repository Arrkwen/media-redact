[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "media-redact"
version = "0.3.0"
description = "Face and OSD redaction for images and videos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "opencv-python-headless>=4.8,<5",
    "onnx",
    "onnxruntime>=1.16",
    "pyclipper>=1.3",
    "imageio[ffmpeg]",
    "loguru",
    "tqdm",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
media-redact = "media_redact.cli:main"
media-region = "media_redact.tool.annotate_region:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["media_redact*"]

[tool.setuptools.package-data]
media_redact = ["models/*.onnx", "models/*.txt"]
"media_redact.tool" = ["templates/*.html"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["media_redact", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"media_redact/tool/annotate_region.py" = ["N802", "A003"]  # HTTP handler method names

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

